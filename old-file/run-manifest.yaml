apiVersion: v1
kind: ServiceAccount
metadata:
  name: kfp-run-trigger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kfp-run-trigger
rules:
  - apiGroups:
      - pipelines.kubeflow.org
    resources:
      - pipelines
      - pipelineversions
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kfp-run-trigger
subjects:
  - kind: ServiceAccount
    name: kfp-run-trigger
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kfp-run-trigger
---
apiVersion: batch/v1
kind: Job
metadata:
  name: start-sleep-pipeline-run
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: kfp-run-trigger
      restartPolicy: Never
      containers:
        - name: create-run
          image: registry.redhat.io/openshift4/ose-cli:latest
          env:
            - name: PIPELINE_NAME
              value: sleep-pipeline-template
            - name: PIPELINE_VERSION_NAME
              value: sleep-pipeline-template-v1
            - name: RUN_NAME
              value: sleep-pipeline-run-001
          command:
            - /bin/bash
            - -ec
            - |
              NAMESPACE="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"

              PIPELINE_ID="$(
                oc get pipelines.pipelines.kubeflow.org "${PIPELINE_NAME}"                   -n "${NAMESPACE}"                   -o jsonpath='{.metadata.uid}'
              )"

              PIPELINE_VERSION_ID="$(
                oc get pipelineversions.pipelines.kubeflow.org "${PIPELINE_VERSION_NAME}"                   -n "${NAMESPACE}"                   -o jsonpath='{.metadata.uid}'
              )"

              curl --fail-with-body --silent --show-error                 -X POST                 "http://ml-pipeline:8888/apis/v2beta1/runs"                 -H "Content-Type: application/json"                 -d "{
                  \"display_name\": \"${RUN_NAME}\",
                  \"pipeline_version_reference\": {
                    \"pipeline_id\": \"${PIPELINE_ID}\",
                    \"pipeline_version_id\": \"${PIPELINE_VERSION_ID}\"
                  },
                  \"runtime_config\": {}
                }"
