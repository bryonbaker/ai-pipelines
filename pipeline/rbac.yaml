apiVersion: v1
kind: ServiceAccount
metadata:
  name: kfp-run-trigger
  namespace: pipeline-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kfp-run-trigger
  namespace: pipeline-demo
rules:
  - apiGroups:
      - pipelines.kubeflow.org
    resources:
      - pipelines
      - pipelineversions
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kfp-run-trigger
  namespace: pipeline-demo
subjects:
  - kind: ServiceAccount
    name: kfp-run-trigger
    namespace: pipeline-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kfp-run-trigger
